<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус нод</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Статус нод</h1>
    <button id="refresh" class="btn">Обновить</button>
  </div>

  <div id="overall" class="card"><span class="muted">Загрузка…</span></div>
  <div id="nodes"></div>

  <div class="card">
    <h2>Настройки</h2>
    <div class="grid">
      <label>Название страницы
        <input id="cfg-title" type="text" placeholder="EssenceVPN · Статус серверов">
      </label>
      <label>Интервал проверок, сек
        <input id="cfg-interval" type="number" min="10" max="3600" value="60">
      </label>
      <label>Порог «деградации» задержки, мс
        <input id="cfg-warn" type="number" min="0" value="500">
      </label>
      <label>Обновление публичной страницы, мин
        <input id="cfg-pages-every" type="number" min="1" value="2">
      </label>
      <label>Тема интерфейса
        <select id="cfg-theme"></select>
      </label>
    </div>
    <label>Ноды (JSON)
      <textarea id="cfg-nodes" rows="7" spellcheck="false">[
  {"name": "Германия", "code": "DE", "host": "31.77.14.139", "ports": [443]},
  {"name": "Нидерланды", "code": "NL", "host": "31.77.16.49", "ports": [443]},
  {"name": "Финляндия", "code": "FI", "host": "87.121.89.72", "ports": [443]}
]</textarea>
    </label>
    <h3>Публичная страница (GitHub Pages)</h3>
    <div class="grid">
      <label>Владелец репозитория<input id="cfg-pages-owner" type="text" placeholder="lofakin"></label>
      <label>Репозиторий<input id="cfg-pages-repo" type="text" placeholder="vpn-status"></label>
      <label>Ветка<input id="cfg-pages-branch" type="text" value="main"></label>
      <label>Токен (не показывается после сохранения)<input id="cfg-pages-token" type="password" autocomplete="off"></label>
    </div>
    <h3>Email-алерты (необязательно)</h3>
    <div class="grid">
      <label>SMTP-хост<input id="cfg-smtp-host" type="text"></label>
      <label>Порт<input id="cfg-smtp-port" type="number" value="587"></label>
      <label>Логин<input id="cfg-smtp-user" type="text"></label>
      <label>Пароль<input id="cfg-smtp-pass" type="password" autocomplete="off"></label>
      <label>От кого<input id="cfg-smtp-from" type="text"></label>
      <label>Кому<input id="cfg-smtp-to" type="text"></label>
    </div>
    <div class="row">
      <button id="save" class="btn primary">Сохранить</button>
      <span id="save-msg" class="muted"></span>
    </div>
  </div>
</div>
<script>
// Themes mirror the panel's own list (mikan web/src/lib/themes.ts).
const LIGHT_THEMES = ["mikan","ocean","sakura","forest","latte","snow","dawn","dune"];
const DARK_THEMES = ["midnight","graphite","abyss","ember","plum","moss","terminal","nord","mocha","tokyo","dracula","aurora","cosmos"];
const THEME_NAMES = {mikan:"Mikan",ocean:"Ocean",sakura:"Sakura",forest:"Forest",latte:"Latte",snow:"Snow",dawn:"Dawn",dune:"Dune",midnight:"Midnight",graphite:"Graphite",abyss:"Abyss",ember:"Ember",plum:"Plum",moss:"Moss",terminal:"Terminal",nord:"Nord",mocha:"Mocha",tokyo:"Tokyo",dracula:"Dracula",aurora:"Aurora",cosmos:"Cosmos"};

let uiTheme = "system";
function resolveTheme() {
  if (uiTheme !== "system") return uiTheme;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "mikan";
}
function applyTheme() {
  const t = resolveTheme();
  const root = document.documentElement;
  root.dataset.theme = t;
  root.dataset.tone = DARK_THEMES.includes(t) ? "dark" : "light";
}
function buildThemeSelect() {
  const sel = document.getElementById("cfg-theme");
  const mk = (v, label) => { const o = document.createElement("option"); o.value = v; o.textContent = label; return o; };
  sel.appendChild(mk("system", "Как в системе (авто)"));
  const gl = document.createElement("optgroup"); gl.label = "Светлые";
  LIGHT_THEMES.forEach(t => gl.appendChild(mk(t, THEME_NAMES[t])));
  const gd = document.createElement("optgroup"); gd.label = "Тёмные";
  DARK_THEMES.forEach(t => gd.appendChild(mk(t, THEME_NAMES[t])));
  sel.appendChild(gl); sel.appendChild(gd);
  sel.value = uiTheme;
  sel.onchange = () => { uiTheme = sel.value; applyTheme(); };
}
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (uiTheme === "system") applyTheme(); });
}
buildThemeSelect();
applyTheme();

let seq = 0;
const pending = {};
function rpc(method, path, body) {
  return new Promise((resolve, reject) => {
    const id = "r" + (++seq);
    pending[id] = {resolve, reject};
    parent.postMessage({type: "rpc", id, method, path, body: body === undefined ? null : body}, "*");
    setTimeout(() => { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 30000);
  });
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type !== "rpc" || !d.id || !pending[d.id]) return;
  const p = pending[d.id]; delete pending[d.id];
  p.resolve(d.json !== undefined ? d.json : (d.body !== undefined ? d.body : d.data));
});

const dotColor = s => s === "up" ? "var(--leaf-500)" : s === "degraded" ? "var(--honey-500)" : s === "down" ? "var(--berry-600)" : "var(--ink-400)";
const pct = v => (v === undefined || v === null || v < 0) ? "—" : v.toFixed(2) + "%";

function barColor(v) {
  if (v === undefined || v === null || v < 0) return "var(--ink-200)";
  return v >= 99 ? "var(--leaf-500)" : v >= 95 ? "var(--honey-500)" : "var(--berry-600)";
}

async function loadStatus() {
  try {
    const d = await rpc("GET", "/status");
    const nodes = d.nodes || [];
    const allUp = nodes.length > 0 && nodes.every(n => n.status === "up");
    const anyDown = nodes.some(n => n.status === "down");
    document.getElementById("overall").innerHTML =
      `<span class="dot" style="background:${anyDown ? "var(--berry-600)" : allUp ? "var(--leaf-500)" : "var(--honey-500)"}"></span> ` +
      (nodes.length === 0 ? "Ноды не добавлены — заполните настройки ниже." :
        anyDown ? "Есть недоступные ноды." : allUp ? "Все ноды работают." : "Есть деградировавшие ноды.");
    document.getElementById("nodes").innerHTML = nodes.map(n => {
      const bars = (n.bars || []).map(v =>
        `<div class="bar" style="background:${barColor(v)}" title="${v < 0 ? "нет данных" : v.toFixed(1) + "%"}"></div>`).join("");
      return `<div class="card"><div class="node-head">
          <span class="dot" style="background:${dotColor(n.status)}"></span>
          <b>${escapeHtml(n.name)}</b> <span class="muted">${escapeHtml(n.code || "")}</span>
          <span class="lat">${n.status === "down" ? "—" : n.latency_ms + " мс"}</span></div>
        <div class="bars">${bars}</div>
        <div class="meta"><span>24 ч · <b>${pct(n.uptime_24)}</b></span>
        <span>7 дн · <b>${pct(n.uptime_7)}</b></span>
        <span>30 дн · <b>${pct(n.uptime_30)}</b></span></div></div>`;
    }).join("");
  } catch (err) {
    document.getElementById("overall").innerHTML = `<span class="muted">Ошибка: ${escapeHtml(String(err))}</span>`;
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadConfig() {
  try {
    const c = await rpc("GET", "/config");
    if (!c) return;
    setVal("cfg-title", c.public_title);
    setVal("cfg-interval", c.interval_sec);
    setVal("cfg-warn", c.latency_warn_ms);
    setVal("cfg-pages-every", c.pages_every_min);
    if (c.ui_theme) { uiTheme = c.ui_theme; document.getElementById("cfg-theme").value = uiTheme; applyTheme(); }
    setVal("cfg-pages-owner", c.pages_owner);
    setVal("cfg-pages-repo", c.pages_repo);
    setVal("cfg-pages-branch", c.pages_branch || "main");
    if (c.nodes && c.nodes.length) document.getElementById("cfg-nodes").value = JSON.stringify(c.nodes, null, 2);
    if (c.smtp) {
      setVal("cfg-smtp-host", c.smtp.host); setVal("cfg-smtp-port", c.smtp.port);
      setVal("cfg-smtp-user", c.smtp.user); setVal("cfg-smtp-from", c.smtp.from);
      setVal("cfg-smtp-to", c.smtp.to);
    }
  } catch (e) { /* first run: no config yet */ }
}
function setVal(id, v) { if (v !== undefined && v !== null && v !== "") document.getElementById(id).value = v; }
const getVal = id => document.getElementById(id).value.trim();

async function saveConfig() {
  const msg = document.getElementById("save-msg");
  let nodes;
  try {
    nodes = JSON.parse(document.getElementById("cfg-nodes").value);
    if (!Array.isArray(nodes)) throw new Error("not an array");
  } catch (e) { msg.textContent = "Ноды: неверный JSON."; return; }
  const cfg = {
    nodes,
    interval_sec: parseInt(getVal("cfg-interval")) || 60,
    latency_warn_ms: parseInt(getVal("cfg-warn")) || 500,
    public_title: getVal("cfg-title"),
    ui_theme: document.getElementById("cfg-theme").value || "system",
    pages_owner: getVal("cfg-pages-owner"),
    pages_repo: getVal("cfg-pages-repo"),
    pages_branch: getVal("cfg-pages-branch") || "main",
    pages_token: getVal("cfg-pages-token"),
    pages_every_min: parseInt(getVal("cfg-pages-every")) || 2,
    smtp: {
      host: getVal("cfg-smtp-host"), port: parseInt(getVal("cfg-smtp-port")) || 587,
      user: getVal("cfg-smtp-user"), pass: getVal("cfg-smtp-pass"),
      from: getVal("cfg-smtp-from"), to: getVal("cfg-smtp-to")
    }
  };
  msg.textContent = "Сохранение…";
  try {
    await rpc("POST", "/config", cfg);
    msg.textContent = "Сохранено.";
    document.getElementById("cfg-pages-token").value = "";
    document.getElementById("cfg-smtp-pass").value = "";
    loadStatus();
  } catch (e) { msg.textContent = "Ошибка: " + e; }
}

document.getElementById("refresh").onclick = loadStatus;
document.getElementById("save").onclick = saveConfig;
loadStatus(); loadConfig();
setInterval(loadStatus, 30000);
</script>
</body>
</html>
